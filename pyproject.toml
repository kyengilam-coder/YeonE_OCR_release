[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yeone-ocr"
version = "0.7.0"
description = "YeonE_OCR · 연어OCR · 세로쓰기 한자·한글 혼용 문헌 OCR·교정 처리기 (Gemini 판독, HWPX 출력)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pymupdf>=1.24",
  "pillow>=10",
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "pydantic>=2.6",
  "google-genai>=1.0",
  "python-hwpx>=6.0",
  "opencc-python-reimplemented>=0.1.7",
  "hanja>=0.15",
  "python-docx>=1.2",
]

[project.scripts]
yeone-ocr = "yeone_ocr.cli:main"

[project.gui-scripts]
yeone-ocr-gui = "yeone_ocr.gui:main"

[tool.setuptools]
packages = ["yeone_ocr", "yeone_ocr.collate"]

[tool.setuptools.package-data]
yeone_ocr = ["지침.md"]
