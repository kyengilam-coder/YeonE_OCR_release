name: Windows release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.repository }}
  cancel-in-progress: false

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
  PYTHONNOUSERSITE: '1'

jobs:
  regression:
    if: github.repository == 'kyengilam-coder/YeonE_OCR_release'
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.5'
          architecture: x64
          cache: pip
          cache-dependency-path: packaging/requirements-windows.lock.txt
      - name: Prepare isolated test environment
        run: |
          python -m venv work/windows-regression/venv
          if ($LASTEXITCODE -ne 0) { throw 'Test environment creation failed' }
          $python = (Resolve-Path work/windows-regression/venv/Scripts/python.exe).Path
          & $python -m pip install -r packaging/requirements-windows.lock.txt
          if ($LASTEXITCODE -ne 0) { throw 'Pinned test dependency installation failed' }
          "TEST_PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Run complete isolated offline regression
        run: |
          & $env:TEST_PYTHON -B -X utf8 tools/check_regression.py --output work/release-regression --workers 2 --fail-fast --prioritize tests/test_regression_receipts.py --prioritize tests/test_release_artifacts.py --prioritize tests/test_generated_section_edit.py --prioritize tests/test_collate_section_edit.py --prioritize tests/test_bookmark_section_editor.py
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed or full coverage was not completed' }
      - name: Preserve complete regression reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-regression
          path: |
            work/release-regression/*.json
            work/release-regression/*.log
          retention-days: 30

  build:
    if: github.repository == 'kyengilam-coder/YeonE_OCR_release'
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      artifact_id: ${{ steps.package.outputs.artifact-id }}
      receipt_sha256: ${{ steps.seal.outputs.receipt_sha256 }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.5'
          architecture: x64
          cache: pip
          cache-dependency-path: packaging/requirements-windows.lock.txt
      - name: Prepare isolated build environment
        run: |
          python -m venv work/windows-release/venv
          if ($LASTEXITCODE -ne 0) { throw 'Virtual environment creation failed' }
          $python = (Resolve-Path work/windows-release/venv/Scripts/python.exe).Path
          & $python -m pip install -r packaging/requirements-windows.lock.txt
          if ($LASTEXITCODE -ne 0) { throw 'Pinned dependency installation failed' }
          "BUILD_PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Locate Inno Setup
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          )
          $compiler = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $compiler) {
            choco install innosetup --version=6.7.3 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
            $compiler = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          }
          if (-not $compiler) { throw 'ISCC.exe was not found' }
          "INNO_COMPILER=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build and verify installer and portable application
        run: |
          ./tools/build_windows.ps1 -Python $env:BUILD_PYTHON -InnoCompiler $env:INNO_COMPILER
      - name: Verify installation, reinstall and removal
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $build = Get-Content -LiteralPath work/windows-release/build-result.json -Raw | ConvertFrom-Json
          $previousDirectory = 'work/windows-release/previous'
          New-Item -ItemType Directory -Force -Path $previousDirectory | Out-Null
          gh release download v1.0.3 --repo $env:GITHUB_REPOSITORY --pattern 'YeonE_OCR-1.0.3-Setup-x64.exe' --dir $previousDirectory
          if ($LASTEXITCODE -ne 0) { throw 'Previous public installer download failed' }
          ./tools/test_windows_installer.ps1 -Installer "dist/YeonE_OCR-$($build.version)-Setup-x64.exe" -ExpectedVersion $build.version -PreviousInstaller "$previousDirectory/YeonE_OCR-1.0.3-Setup-x64.exe"
      - name: Prepare complete release artifacts
        run: |
          & $env:BUILD_PYTHON tools/prepare_windows_release.py dist --revision HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Release artifact preparation failed' }
      - name: Seal the verified release bytes
        id: seal
        run: |
          & $env:BUILD_PYTHON tools/verify_release_bundle.py seal dist --commit $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Release bundle validation failed' }
          $hash = (Get-FileHash -LiteralPath dist/release-bundle.json -Algorithm SHA256).Hash.ToLowerInvariant()
          "receipt_sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Preserve exact binaries for publication and optional local QA
        id: package
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-package
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Preserve release validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-validation
          path: |
            work/windows-release/build-result.json
            work/windows-release/smoke/*.json
            work/windows-release/installation-check/*.json
            work/windows-release/installation-check/*.log
          retention-days: 30

  publish:
    needs: [regression, build]
    if: github.repository == 'kyengilam-coder/YeonE_OCR_release' && needs.regression.result == 'success' && needs.build.result == 'success'
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.5'
          architecture: x64
      - name: Download the exact build job artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          merge-multiple: true
          path: dist
      - name: Verify artifact bytes, version and committed source before publishing
        env:
          RELEASE_RECEIPT_SHA256: ${{ needs.build.outputs.receipt_sha256 }}
        run: |
          python -B -X utf8 tools/verify_release_bundle.py verify dist --commit $env:GITHUB_SHA --receipt-sha256 $env:RELEASE_RECEIPT_SHA256
          if ($LASTEXITCODE -ne 0) { throw 'Downloaded artifacts differ from the verified build' }
      - name: Upload verified release as draft, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $manifest = Get-Content -LiteralPath dist/update.json -Raw | ConvertFrom-Json
          $version = $manifest.version
          $tag = "v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists; bump the version before publishing" }
          $assets = @(
            'dist/YeonE_OCR-Windows-x64.exe',
            "dist/YeonE_OCR-$version-Setup-x64.exe",
            'dist/update.json',
            'dist/SHA256SUMS.txt',
            "dist/YeonE_OCR-$version-source.zip",
            "dist/YeonE_OCR-$version-licenses.zip"
          )
          $notesSource = 'docs/release-notes.md'
          if (-not (Test-Path -LiteralPath $notesSource)) { throw 'Release notes are missing' }
          $currentNotes = ((Get-Content -LiteralPath $notesSource -Raw -Encoding UTF8) -split '(?m)^---\s*$', 2)[0].Trim()
          if (-not $currentNotes.StartsWith("# 연어OCR $version ")) { throw 'Current release notes version mismatch' }
          New-Item -ItemType Directory -Force -Path work/windows-release | Out-Null
          $notes = 'work/windows-release/release-notes-current.md'
          [IO.File]::WriteAllText($notes, ($currentNotes + "`n"), [Text.UTF8Encoding]::new($false))
          gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --draft --title "YeonE OCR $tag · Windows" --notes-file $notes @assets
          if ($LASTEXITCODE -ne 0) { throw 'Draft release upload failed' }
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed; uploaded release remains a draft' }
