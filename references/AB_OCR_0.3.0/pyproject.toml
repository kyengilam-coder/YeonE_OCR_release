[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ab-ocr"
version = "0.3.0"
description = "AB_OCR: Korean and Hanja OCR editor"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
ocr = ["pillow>=10", "pymupdf>=1.24"]
dev = ["pytest>=8"]

[project.scripts]
ab-ocr = "ab_ocr.__main__:main"

[tool.setuptools.packages.find]
include = ["ab_ocr*"]
